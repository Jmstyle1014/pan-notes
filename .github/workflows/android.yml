# Builds the Panyard Android app (APK) whenever Panyard or the Android wrapper changes,
# and puts it on the repo's Releases page: .../releases/latest/download/Panyard.apk
name: Android app
on:
  push:
    branches: [main, master]
    paths: ['panyard/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Pack the app
        run: python3 android/prep.py
      - name: Build the APK
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Panyard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Panyard for Android (version 1.${{ github.run_number }})
          body: "Tap **Panyard.apk** below on your Android phone to download it, then open it to install. A new version installs over the old one and keeps your songs."
          files: Panyard.apk
          make_latest: true
